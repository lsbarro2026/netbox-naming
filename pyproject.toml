[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-naming"
version = "0.1.0"
description = "Generate and validate device names from naming conventions in NetBox."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["netbox_naming*"]

[tool.setuptools.package-data]
netbox_naming = ["migrations/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
